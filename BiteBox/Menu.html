    <!-- icon filter section starts here -->
    <div class="category-icons">
        <div class="icon-box">
            <img src="../images/burger.jpg" alt="all-menus">

        <div class="icon-box">

    <!-- menu section start here -->
    <section class="menu">
        <!-- <h2>Our Menu</h2> -->
        <div class="menu-container">
            <div class="card">
                <img src="../images/burger.jpg" alt="burger-img">
                <h3>Burger</h3>
                <p>Cheeesy Burger</p>
                <span>₹189</span>
                <button>Add to Cart</button>
            </div>

            <div class="card">
                <img src="../images/onion-pizza.jpg" alt="burger-img">
                <h3>Onion Pizza</h3>
                <p>Cheeesy Onion Pizza</p>
                <span>₹169</span>
                <button>Add to Cart</button>
            </div>

            <div class="card">
                <img src="../images/capsicum-pizza.jpg" alt="burger-img">
                <h3>Capsicum Pizza </h3>
                <p>Cheesy Capsicum Pizza</p>
                <span>₹199</span>
                <button>Add to Cart</button>
            </div>


            <div class="card">
                <img src="../images/noodles.jpg" alt="burger-img">
                <h3>Veg Hakka Noodles</h3>
                <p>Spicy Noodles</p>
                <span>₹299</span>
                <button>Add to Cart</button>
            </div>


            <div class="card">
                <img src="../images/pasta.jpg" alt="burger-img">
                <h3>Pasta</h3>
                <p>Red Sauce Pasta</p>
                <span>₹230</span>
                <button>Add to Cart</button>
